<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480"
     role="img" aria-label="DumpSock mascot — wet hanging sock with cute smiling face">
  <title>DumpSock mascot</title>
  <desc>Hand-authored from the approved v2 mascot direction. Hanging white sock with thick black outline, wavy ribbed cuff at the top, two red horizontal stripes, large closed/smiling eyes (black ovals with arc highlights inside), small lobed mouth with a red tongue and a single blue drool drop inside, and a melting/dripping multi-lobed bottom implying the toe-box is damp.</desc>

  <defs>
    <linearGradient id="ds-tongue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FF5A4A"/>
      <stop offset="100%" stop-color="#D02519"/>
    </linearGradient>
    <linearGradient id="ds-drool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#9BDBFB"/>
      <stop offset="100%" stop-color="#46B5EF"/>
    </linearGradient>
  </defs>

  <!-- ── Body with melting / dripping bottom ──────────────────────
       Starts top-left, goes clockwise. Sides are mostly vertical.
       Bottom is irregular: left lobe (big), inner notch + small
       central drip, right lobe (big). All curves cubic-Bezier so
       they read as melted/wet without looking jagged.
       ─────────────────────────────────────────────────────────── -->
  <path d="
    M 78 28
    L 242 28
    Q 262 28 262 48
    L 262 388
    C 262 410, 256 426, 240 438
    C 228 448, 220 454, 215 460
    C 211 466, 204 462, 200 454
    C 197 446, 192 436, 185 430
    C 180 442, 173 458, 165 463
    C 158 462, 152 452, 146 438
    C 142 442, 137 458, 130 462
    C 122 460, 113 450, 104 442
    C 92 436, 78 432, 68 422
    C 60 414, 56 402, 56 388
    L 56 48
    Q 56 28 76 28
    Z
  " fill="#FFFFFF" stroke="#111111" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ── Wavy ribbed cuff ──────────────────────────────────────
       Each rib is a vertical S-curve, not a straight line — matches
       the squiggly ribbing of the approved mascot.
       ─────────────────────────────────────────────────────── -->
  <g stroke="#BDC0C6" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 88 44 c 4 9 -4 17 0 26 c 4 9 -4 17 0 26"/>
    <path d="M 112 42 c 4 9 -4 17 0 26 c 4 9 -4 17 0 28"/>
    <path d="M 136 42 c 4 9 -4 17 0 26 c 4 9 -4 17 0 28"/>
    <path d="M 160 42 c 4 9 -4 17 0 26 c 4 9 -4 17 0 28"/>
    <path d="M 184 42 c 4 9 -4 17 0 26 c 4 9 -4 17 0 28"/>
    <path d="M 208 42 c 4 9 -4 17 0 26 c 4 9 -4 17 0 28"/>
    <path d="M 232 44 c 4 9 -4 17 0 26 c 4 9 -4 17 0 26"/>
  </g>

  <!-- ── Two red horizontal stripes, thin white gap between them ── -->
  <rect x="56" y="118" width="206" height="18" fill="#E74C3C"/>
  <rect x="56" y="146" width="206" height="18" fill="#E74C3C"/>

  <!-- ── Eyes ──────────────────────────────────────────────────
       Large solid-black ovals with an inverted-U white arc inside
       at the bottom-center — the "happy/squinting" closed-eye look.
       ─────────────────────────────────────────────────────── -->
  <ellipse cx="124" cy="222" rx="22" ry="24" fill="#111111"/>
  <ellipse cx="196" cy="222" rx="22" ry="24" fill="#111111"/>
  <!-- Smile arcs inside (open at the top, curving down at the
       bottom of the eye to read as ◡). -->
  <path d="M 109 216 Q 124 238 139 216" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 181 216 Q 196 238 211 216" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- ── Mouth ─────────────────────────────────────────────────
       Small lobed mouth: top has three soft humps (wavy line),
       sides taper down and out, bottom rounds to the right where
       the tongue + drool emerge.
       ─────────────────────────────────────────────────────── -->
  <!-- Centered, smaller, lobed open mouth — 3 small humps along the
       top edge, sides taper down to a rounded bottom. -->
  <path d="
    M 140 272
    Q 146 262 154 270
    Q 160 260 168 270
    Q 174 262 182 272
    Q 186 290 180 304
    Q 173 318 161 320
    Q 149 318 142 304
    Q 136 290 140 272
    Z
  " fill="#111111"/>

  <!-- Red tongue, centered-right inside the mouth -->
  <ellipse cx="164" cy="302" rx="9" ry="9" fill="url(#ds-tongue)"/>

  <!-- Blue drool drip — falls straight down from the bottom of
       the tongue, perfectly centered under it. -->
  <path d="
    M 159 318
    C 158 332, 156 346, 160 358
    C 165 368, 172 366, 172 356
    C 172 344, 168 328, 165 318
    Z
  " fill="url(#ds-drool)"/>
  <ellipse cx="166" cy="342" rx="2" ry="4" fill="#FFFFFF" opacity="0.65"/>
</svg>
