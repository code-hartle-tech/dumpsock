<?xml version="1.0" encoding="UTF-8"?>
<!--
  DumpSock app icon — FULL-BLEED variant (2026-05-17)

  Same design language as dumpsock-icon.svg (white tube-sock cuff with
  ribbing + two brand-red stripes) but with the sock fabric extended
  to all four edges of the icon — no off-white margin, no drop shadow,
  no outline, no rounded "opening." The iOS/macOS icon mask (squircle)
  will round the visible corners when the OS draws the icon.

  Internal structure top→bottom:
    • Inner cuff shadow gradient at the very top (depth at the opening)
    • Vertical ribbing — 18 thin slate lines, opacity 55%
    • Two horizontal brand-red stripes with a faint top-edge highlight
    • Plain white sock body filling the rest
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="cuffInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1F1F1F" stop-opacity="0.30"/>
      <stop offset="45%"  stop-color="#1F1F1F" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1F1F1F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="stripeShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <rect x="0" y="0" width="1024" height="200" fill="url(#cuffInner)"/>

  <g stroke="#A0A0A8" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
    <line x1="48"  y1="48" x2="48"  y2="420"/>
    <line x1="105" y1="48" x2="105" y2="420"/>
    <line x1="162" y1="48" x2="162" y2="420"/>
    <line x1="219" y1="48" x2="219" y2="420"/>
    <line x1="276" y1="48" x2="276" y2="420"/>
    <line x1="333" y1="48" x2="333" y2="420"/>
    <line x1="390" y1="48" x2="390" y2="420"/>
    <line x1="447" y1="48" x2="447" y2="420"/>
    <line x1="504" y1="48" x2="504" y2="420"/>
    <line x1="561" y1="48" x2="561" y2="420"/>
    <line x1="618" y1="48" x2="618" y2="420"/>
    <line x1="675" y1="48" x2="675" y2="420"/>
    <line x1="732" y1="48" x2="732" y2="420"/>
    <line x1="789" y1="48" x2="789" y2="420"/>
    <line x1="846" y1="48" x2="846" y2="420"/>
    <line x1="903" y1="48" x2="903" y2="420"/>
    <line x1="960" y1="48" x2="960" y2="420"/>
  </g>

  <rect x="0" y="478" width="1024" height="108" fill="#E62A28"/>
  <rect x="0" y="478" width="1024" height="108" fill="url(#stripeShine)"/>
  <rect x="0" y="630" width="1024" height="108" fill="#E62A28"/>
  <rect x="0" y="630" width="1024" height="108" fill="url(#stripeShine)"/>
</svg>
