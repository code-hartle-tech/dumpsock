name: Deploy docs

# Builds BOTH VitePress sites (external + internal), merges them into a
# single Pages deployment so dumpsock.hartle.tech serves:
#   /       → public marketing + user docs (external, at root)
#   /wiki/  → developer-facing internal docs (public-but-unindexed,
#             robots.txt + noindex; do NOT put secrets here)

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build external (public docs at /docs/)
        working-directory: docs
        run: npm run external:build

      - name: Build internal (semi-public wiki at /wiki/)
        working-directory: docs
        run: npm run internal:build

      - name: Compose unified Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/wiki
          # External (marketing + user docs) → root of _site.
          cp -r docs/external/.vitepress/dist/. _site/
          # Internal (dev wiki) → /wiki/ subpath.
          cp -r docs/internal/.vitepress/dist/. _site/wiki/

          # Custom domain — Pages reads this on first deploy to enforce HTTPS.
          echo "dumpsock.hartle.tech" > _site/CNAME

          # robots.txt — allow everything except /wiki (internal,
          # semi-public, do-not-index).
          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Disallow: /wiki/

          Sitemap: https://dumpsock.hartle.tech/sitemap.xml
          EOF

          echo "--- _site tree (top 30):"
          find _site -maxdepth 3 -type f | sort | head -30
          echo "--- sizes:"
          du -sh _site _site/wiki

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
