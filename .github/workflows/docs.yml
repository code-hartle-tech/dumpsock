name: Deploy docs

# Builds the public VitePress site (external) and deploys it to GitHub
# Pages so dumpsock.hartle.tech serves it at root.
#
# Internal/dev docs do NOT live here — they live in the org wiki at
# void.hartle.tech/dumpsock/ (tailnet-only). See
# https://github.com/code-hartle-tech/hartle-tech-wiki.

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build (public docs at root)
        working-directory: docs
        run: npm run build

      - name: Compose Pages site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Public site → root of _site.
          cp -r docs/external/.vitepress/dist/. _site/

          # Custom domain — Pages reads this on first deploy to enforce HTTPS.
          echo "dumpsock.hartle.tech" > _site/CNAME

          # robots.txt — fully open; nothing private lives here.
          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://dumpsock.hartle.tech/sitemap.xml
          EOF

          echo "--- _site tree (top 30):"
          find _site -maxdepth 3 -type f | sort | head -30
          echo "--- size:"
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
