name: Deploy docs

# Builds BOTH VitePress sites (external + internal), merges them into a
# single Pages deployment so dumpsock.hartle.tech serves:
#   /docs/  → public marketing / user docs (external)
#   /wiki/  → developer-facing internal docs (public-but-unindexed,
#             robots.txt + noindex; do NOT put secrets here)
#   /       → meta-refresh to /docs/  (root placeholder for now)

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build external (public docs at /docs/)
        working-directory: docs
        run: npm run external:build

      - name: Build internal (semi-public wiki at /wiki/)
        working-directory: docs
        run: npm run internal:build

      - name: Compose unified Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/docs _site/wiki
          cp -r docs/external/.vitepress/dist/. _site/docs/
          cp -r docs/internal/.vitepress/dist/. _site/wiki/

          # Custom domain — Pages reads this on first deploy to enforce HTTPS.
          echo "dumpsock.hartle.tech" > _site/CNAME

          # robots.txt — allow /docs (public marketing) + block /wiki
          # (internal, semi-public, do-not-index).
          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /docs/
          Disallow: /wiki/

          Sitemap: https://dumpsock.hartle.tech/docs/sitemap.xml
          EOF

          # Root index — simple meta-refresh to /docs/ until a marketing
          # landing page lands. Keeps dumpsock.hartle.tech/ from 404'ing.
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <meta http-equiv="refresh" content="0; url=/docs/" />
            <link rel="canonical" href="https://dumpsock.hartle.tech/docs/" />
            <title>DumpSock — redirecting…</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif;
                     background: #FCFEFB; color: #1A1A1A; text-align: center;
                     padding: 4rem 1rem; }
              a { color: #E74C3C; }
            </style>
          </head>
          <body>
            <p>Heading to <a href="/docs/">the docs</a>…</p>
          </body>
          </html>
          EOF

          echo "--- _site tree (top 30):"
          find _site -maxdepth 3 -type f | sort | head -30
          echo "--- sizes:"
          du -sh _site _site/docs _site/wiki

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
