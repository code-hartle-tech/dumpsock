name: Docs build check

# Validates that BOTH VitePress sites still build cleanly on every PR /
# push touching docs/**. No deploy step — production deploy is handled
# by Ansible on the OVH VPS (clones this repo, builds both halves, served
# by Caddy at dumpsock.hartle.tech). See
# hartle.tech-terraform/ansible/roles/product_docs/.

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build external (public site at root)
        working-directory: docs
        run: npm run external:build

      - name: Build internal (wiki at /wiki/, tailnet-only on VPS)
        working-directory: docs
        run: npm run internal:build

      - name: Summary
        run: |
          {
            echo "## Docs build OK"
            echo ""
            echo "Both halves built cleanly. The product_docs Ansible role"
            echo "on the OVH VPS will pull this commit on the next iac-apply"
            echo "run and serve via Caddy at:"
            echo "  - https://dumpsock.hartle.tech/ (public)"
            echo "  - https://dumpsock.hartle.tech/wiki/ (tailnet-only)"
          } >> "$GITHUB_STEP_SUMMARY"
