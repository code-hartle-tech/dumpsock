name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for git describe

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Compute version
        id: ver
        run: |
          VERSION="$(git describe --tags --always)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          ext=""
          [[ "$GOOS" == "windows" ]] && ext=".exe"
          out="dist/dumpsock-${VERSION}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/code-hartle-tech/dumpsock/internal/branding.Version=${VERSION} \
              -X github.com/code-hartle-tech/dumpsock/internal/branding.Commit=$(git rev-parse --short=12 HEAD)" \
            -o "$out" ./cmd/dumpsock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumpsock-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: publish github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
